<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Love ❤️</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,"Tahoma",sans-serif;
}

body{
    background:#58111A;
    color:white;
    min-height:100vh;
    overflow-x:hidden;
}

/* =========================
   شاشة القفل
========================= */

#lockScreen{
    position:fixed;
    inset:0;
    background:#58111A;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:1000;
    transition:opacity .7s ease;
    overflow:hidden;
}

/* القلوب المتحركة */

.floatHeart{
    position:absolute;
    bottom:-40px;
    color:#ff4d6d;
    font-size:20px;
    animation:up 5s linear forwards;
    pointer-events:none;
}

@keyframes up{
    0%{
        transform:translateY(0) scale(.5);
        opacity:0;
    }
    20%{
        opacity:.8;
    }
    100%{
        transform:translateY(-110vh) scale(1.2);
        opacity:0;
    }
}

/* القلب الحقيقي */

.heartBox{
    position:relative;
    width:330px;
    height:360px;
    display:flex;
    justify-content:center;
    align-items:center;
}

.heartShape{
    position:absolute;
    width:250px;
    height:250px;
    background:rgba(255,77,109,.22);
    transform:rotate(-45deg);
    border-radius:35px;
    box-shadow:0 15px 50px rgba(0,0,0,.35);
}

.heartShape:before,
.heartShape:after{
    content:"";
    position:absolute;
    width:250px;
    height:250px;
    background:rgba(255,77,109,.22);
    border-radius:50%;
}

.heartShape:before{
    top:-125px;
    left:0;
}

.heartShape:after{
    left:125px;
    top:0;
}

.lockContent{
    position:relative;
    z-index:5;
    width:220px;
    text-align:center;
    display:flex;
    flex-direction:column;
    align-items:center;
}

    width:70
