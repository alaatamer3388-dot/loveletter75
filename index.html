<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Love ❤️</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }
        body {
            background-color: #58111A;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            padding-bottom: 50px;
        }
        
        #lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #58111A;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            transition: opacity 0.5s ease;
        }

        .floating-heart {
            position: absolute;
            color: #ff4d6d;
            font-size: 20px;
            animation: flyUp 4s linear infinite;
            opacity: 0.7;
        }
        @keyframes flyUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        .heart-card {
            background: rgba(255, 255, 255, 0.12);
            width: 85%;
            max-width: 340px;
            padding: 30px 20px;
            border-radius: 150px 150px 120px 120px;
            text-align: center;
            backdrop-filter: blur(8px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 2;
        }

        .profile-pic {
            width: 85px;
            height: 85px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #ff4d6d;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .heart-card h2 {
            font-size: 22px;
            margin-bottom: 5px;
            color: #fff;
        }

        .heart-card p {
            font-size: 13px;
            color: #ffccd5;
            margin-bottom: 20px;
        }

        .heart-card input {
            width: 80%;
            padding: 10px;
            border-radius: 20px;
            border: none;
            outline: none;
            text-align: center;
            font-size: 15px;
            margin-bottom: 15px;
            background: rgba(255,255,255,0.9);
            color: #333;
        }

        .heart-card button {
            background: #ff4d6d;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 20px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.4);
        }
        
        #main-content {
            display: none;
            width: 100%;
            max-width: 480px;
            padding: 20px;
            flex-direction: column;
            align-items: center;
        }

        /* شريط الأغاني الظاهر تحت */
        .music-player-bar {
            width: 100%;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 10px 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            backdrop-filter: blur(5px);
        }
        .music-player-bar audio {
            width: 100%;
            height: 35px;
            margin-top: 5px;
        }
        .song-title {
            font-size: 13px;
            color: #ffccd5;
            margin-bottom: 3px;
        }

        .card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            margin: 10px 0;
            width: 100%;
            text-align: center;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        
        .step-section {
            display: none;
            width: 100%;
            flex-direction: column;
            align-items: center;
        }
        .step-section.active {
            display: flex;
        }

        .message-card {
            font-size: 15px;
            line-height: 1.8;
            color: #ffe6eb;
            min-height: 60px;
        }
        .counter-box {
            display: flex;
            justify-content: space-around;
            margin: 15px 0;
        }
        .time-unit {
            background: rgba(0,0,0,0.2);
            padding: 8px;
            border-radius: 12px;
            min-width: 65px;
        }
        .time-unit span {
            display: block;
            font-size: 18px;
            font-weight: bold;
        } المؤشر والكلام اللي بيترس
        .time-unit label {
            font-size: 11px;
            color: #ffccd5;
        }
        .photo-frame {
            width: 100%;
            height: 350px;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 10px;
            background: #333;
        }
        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .caption {
            font-size: 15px;
            font-weight: bold;
            color: #ffccd5;
            margin-bottom: 5px;
            min-height: 30px;
        }
        
        .action-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 10px 30px;
            border-radius: 25px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin: 15px 0;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        .action-btn:hover {
            background: #ff4d6d;
            border-color: #ff4d6d;
        }
    </style>
</head>
<body>

    <!-- شاشة قفل الباسورد -->
    <div id="lock-screen">
        <div class="heart-card">
            <img src="https://i.postimg.cc/SQZ2MmSy/1e9cbddcc345fe84372957aaf1e4b0d4.jpg" alt="Profile" class="profile-pic">
            <h2>Ready? 🥹</h2>
            <p>my everything</p>
            <input type="password" id="password-input" placeholder="اكتب الباسورد (love)">
            <button onclick="checkPassword()">Unlock 🔓</button>
        </div>
    </div>

    <!-- محتوى الموقع الأساسي -->
    <div id="main-content">
        
        <!-- شريط الأغاني الظاهر تحت ومتحكم فيه (أغنيتين) -->
        <div class="music-player-bar">
            <div class="song-title" id="current-song-name">🎶 Now Playing: Song 1</div>
            <audio id="audio-player" controls>
                <source src="song1.mp3" type="audio/mp3">
                متصفحك لا يدعم تشغيل الصوت
            </audio>
        </div>

        <!-- الخطوة الأولى -->
        <div id="step-1" class="step-section active">
            <div class="card message-card" data-text="بحبك بكل حاجة في حياتي، وحقك عليا لو ضايقتك تعالِ نفكر كل حاجة بينا هنا ونبدأ بداية جديده <br>loveee youu 🤍"></div>
            <button class="action-btn" onclick="nextStep(2)">Next 💖</button>
        </div>

        <!-- الخطوة الثانية (تاريخ البداية والعداد) -->
        <div id="step-2" class="step-section">
            <div class="card">
                <h3 style="margin-bottom: 5px; color: #ffccd5;">بدايتنا 🌸</h3>
                <p style="font-size: 13px; color: #ddd; margin-bottom: 10px;">سوا من التاريخ المميز</p>
                <div class="counter-box" id="counter">
                    <div class="time-unit"><span id="days">0</span><label>يوم</label></div>
                    <div class="time-unit"><span id="hours">0</span><label>ساعة</label></div>
                    <div class="time-unit"><span id="minutes">0</span><label>دقيقة</label></div>
                    <div class="time-unit"><span id="seconds">0</span><label>ثانية</label></div>
                </div>
                <p style="font-size: 13px; margin-top: 5px; color: #ffccd5;">كل ثانية بتعدي وأنت في قلبي ❤</p>
            </div>
            <button class="action-btn" onclick="nextStep(3)">Memories 📸</button>
        </div>

        <!-- الخطوة الثالثة (الصور والذكريات) -->
        <div id="step-3" class="step-section">
            <div class="card">
                <div class="photo-frame">
                    <img src="https://i.postimg.cc/rpxcqNmV/283e634604b0b5e2928f306b60a8aa6d.jpg" alt="Photo 1">
                </div>
                <div class="caption" data-text="بحبك يبطتي 🌍❤️"></div>
            </div>
            <button class="action-btn" onclick="nextStep(4)">Next 🤎</button>
        </div>

        <!-- الخطوة الرابعة (الصورة الثانية وبداية الأغنية الثانية) -->
        <div id="step-4" class="step-section">
            <div class="card">
                <div class="photo-frame">
                    <img src="https://i.postimg.cc/W1SYgDH0/f5ef543c1df8bd4ada03e752d0b24a46.jpg" alt="Photo 2">
                </div>
                <div class="caption" data-text="نور عيني ❤️"></div>
            </div>
            <div class="card message-card" style="font-size: 14px;" data-text="بحبك قوي<br>حق عليا لو زعلتك 💋<br>ربنا يخليكي ليا"></div>
            <button class="action-btn" onclick="switchToSecondSong(); nextStep(5);">Memories 💕</button>
        </div>

        <!-- الخطوة الخامسة (الخاتمة) -->
        <div id="step-5" class="step-section">
            <div class="card">
                <div class="photo-frame">
                    <img src="https://i.postimg.cc/g0CJD0wY/file-0000000032788210b4f172257c12d7bb.png" alt="Photo 3">
                </div>
                <div class="caption" data-text="بوسة الاستيك أحلى 😂❤️"></div>
            </div>
            <div class="card message-card" style="font-size: 18px; font-weight: bold; color: #fff;" data-text="وبس كده.. وبنكبر الذكريات سوا يا عيوني ❤️"></div>
        </div>

    </div>

    <script>
        function createHearts() {
            const lockScreen = document.getElementById('lock-screen');
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            lockScreen.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 4000);
        }
        setInterval(createHearts, 300);

        function checkPassword() {
            const pass = document.getElementById('password-input').value.trim().toLowerCase();
            if (pass === 'love') {
                document.getElementById('lock-screen').style.opacity = 0;
                setTimeout(() => {
                    document.getElementById('lock-screen').style.display = 'none';
                    document.getElementById('main-content').style.display = 'flex';
                    
                    const audio = document.getElementById('audio-player');
                    audio.play().catch(e => console.log("Audio play blocked"));
                    
                    // تشغيل ترسيّة الكلمات للخطوة الأولى فور الفتح
                    typeWriterEffect(document.querySelector('#step-1 .message-card'));
                }, 500);
            } else {
                alert('الباسورد غلط! اكتبي: love');
            }
        }

        // دالة ترسية الكلام حرف بحرف (Typewriter Effect)
        function typeWriterEffect(element) {
            if (!element || element.dataset.typed) return;
            element.dataset.typed = "true";
            
            const htmlContent = element.getAttribute('data-text');
            element.innerHTML = "";
            let i = 0;
            
            function typing() {
                if (i < htmlContent.length) {
                    // معالجة سريعة لوسوم الـ HTML زي <br> عشان متبوظش
                    if (htmlContent.substr(i, 5) === '<br>') {
                        element.innerHTML += '<br>';
                        i += 5;
                    } else {
                        element.innerHTML += htmlContent.charAt(i);
                        i++;
                    }
                    setTimeout(typing, 40); // سرعة ترسية الكلام
                }
            }
            typing();
        }

        function nextStep(stepNumber) {
            const sections = document.querySelectorAll('.step-section');
            sections.forEach(sec => sec.classList.remove('active'));
            
            const targetSection = document.getElementById('step-' + stepNumber);
            if (targetSection) {
                targetSection.classList.add('active');
                window.scrollTo({ top: 0, behavior: 'smooth' });
                
                // تشغيل تأثير ترسية الكلام في الخطوة الجديدة
                const elementsToType = targetSection.querySelectorAll('[data-text]');
                elementsToType.forEach(el => typeWriterEffect(el));
            }
        }

        function switchToSecondSong() {
            const audio = document.getElementById('audio-player');
            audio.src = 'song2.mp3';
            document.getElementById('current-song-name').innerText = '🎶 Now Playing: Song 2';
            audio.play().catch(e => console.log("Audio 2 play blocked"));
        }

        const startDate = new Date('2026-05-07T00:00:00');

        function updateCounter() {
            const now = new Date();
            const diff = now - startDate;

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours;
            document.getElementById('minutes').innerText = minutes;
            document.getElementById('seconds').innerText = seconds;
        }

        setInterval(updateCounter, 1000);
        updateCounter();
    </script>
</body>
                </html>
